packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - expo-image-manipulator@57.0.15
  - expo-image-picker@57.0.15
# Expo's Metro config supports isolated installs and preserves React peer contexts.
nodeLinker: isolated
overrides:
  '@react-native/metro-config': 0.86.3
  react-native-gesture-handler: 2.32.0
  # Keep Expo SDK 57's native animation pair together; Reanimated 4.6 needs Worklets 0.12.
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
